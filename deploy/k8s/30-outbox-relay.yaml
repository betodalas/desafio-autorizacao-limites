apiVersion: apps/v1
kind: Deployment
metadata:
  name: outbox-relay
  namespace: financas
  labels:
    app: outbox-relay
spec:
  replicas: 1
  selector:
    matchLabels:
      app: outbox-relay
  template:
    metadata:
      labels:
        app: outbox-relay
    spec:
      containers:
        - name: outbox-relay
          image: outbox-relay-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
              name: metrics
          envFrom:
            - configMapRef:
                name: aws-local-config
            - secretRef:
                name: aws-local-credentials
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: outbox-relay
  namespace: financas
spec:
  selector:
    app: outbox-relay
  ports:
    - port: 9090
      targetPort: 9090
---
# Não há scaler nativo do KEDA para "itens pendentes em uma GSI do
# DynamoDB", então o outbox-relay expõe sua própria métrica (ver
# services/outbox-relay/src/metrics_server.py) e o KEDA a consome via o
# scaler genérico `metrics-api` (ver ADR 02/05).
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: outbox-relay-scaler
  namespace: financas
spec:
  scaleTargetRef:
    name: outbox-relay
  minReplicaCount: 1
  maxReplicaCount: 3
  cooldownPeriod: 30
  pollingInterval: 10
  triggers:
    - type: metrics-api
      metadata:
        targetValue: "10"
        url: "http://outbox-relay.financas.svc.cluster.local:9090/metrics"
        valueLocation: "pendentes"
        method: "GET"
