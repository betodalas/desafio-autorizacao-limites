# LocalStack roda dentro do próprio cluster kind, simulando DynamoDB, SQS
# e EventBridge para o ambiente local (ver ADR 03). Em produção seria
# simplesmente a AWS real — nenhum destes manifestos existiria.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: financas
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:3.8
          ports:
            - containerPort: 4566
          env:
            - name: SERVICES
              value: "dynamodb,sqs,events"
            - name: DEFAULT_REGION
              value: "us-east-1"
            - name: PERSISTENCE
              value: "0"
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: financas
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - port: 4566
      targetPort: 4566
      nodePort: 30566
